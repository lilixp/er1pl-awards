<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2129;--muted:#5d6470;--line:#e3e6eb;--accent:#1f5fa8;--accent-bg:#e7f0fb;--gold:#8a5a00;--gold-bg:#fdf1d8}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--card:#1c1f24;--text:#e8eaed;--muted:#a0a7b1;--line:#2c3038;--accent:#7fb1ee;--accent-bg:#1b2a3d;--gold:#f0c060;--gold-bg:#3a2e14}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
header{max-width:1100px;margin:0 auto;padding:32px 20px 8px}
h1{margin:0;font-size:28px;font-weight:600}
.sub{color:var(--muted);margin:4px 0 0}
.links{margin-top:10px;font-size:14px}
.links a{color:var(--accent);text-decoration:none;margin-right:16px}
.links a:hover{text-decoration:underline}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:140px}
.stat b{display:block;font-size:24px}
.stat span{font-size:13px;color:var(--muted)}
main{max-width:1100px;margin:0 auto;padding:8px 20px 40px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}
.filters button{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.filters button.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.thumb{position:relative;aspect-ratio:1.414/1;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.thumb .ph{font-size:13px;color:var(--accent);text-align:center;padding:10px}
.thumb::after{content:"ER1PL";position:absolute;right:8px;bottom:6px;font-size:12px;font-weight:700;letter-spacing:1px;color:#fff;background:rgba(0,0,0,.35);padding:1px 6px;border-radius:4px}
.badge.dx{background:var(--accent-bg);color:var(--accent)}
.badge{position:absolute;left:8px;top:8px;font-size:12px;font-weight:600;background:var(--gold-bg);color:var(--gold);padding:2px 8px;border-radius:6px}
.info{padding:10px 12px 12px}
.info h3{margin:0;font-size:15px;font-weight:600}
.info p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.info .res{color:var(--text);font-weight:500}
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:10;align-items:center;justify-content:center;padding:20px}
.lb.open{display:flex}
.lb-box{background:var(--card);border-radius:12px;width:min(1000px,100%);height:min(90vh,800px);display:flex;flex-direction:column;overflow:hidden}
.lb-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:10px}
.lb-head b{font-size:15px}
.lb-head button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:4px 12px;cursor:pointer}
.lb iframe{flex:1;border:0;width:100%}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 20px 30px}
</style>

const grid = document.getElementById('grid');
const filtersEl = document.getElementById('filters');
const years = [...new Set(D.filter(d => !d.cat).map(d => d.y))].sort((a, b) => b - a);
const FILTERS = [{k:'all',l:'All'},{k:'dxcc',l:'🌍 DXCC awards'},{k:'first',l:'🥇 1st places'},...years.map(y => ({k:String(y),l:String(y)}))];
let current = 'all';

document.getElementById('sTotal').textContent = D.filter(d => !d.cat).length;
document.getElementById('sDxcc').textContent = D.filter(d => d.cat === 'dxcc').length;
document.getElementById('sFirst').textContent = D.filter(d => d.f).length;
document.getElementById('sYears').textContent = years.length;

function thumbUrl(id){ return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w600'; }

function render(){
  const list = D.filter(d => current === 'all' || (current === 'dxcc' ? d.cat === 'dxcc' : current === 'first' ? d.f : (String(d.y) === current && !d.cat)));
  grid.innerHTML = '';
  list.forEach(d => {
    const card = document.createElement('div');
    card.className = 'card';
    card.tabIndex = 0;
    card.innerHTML =
      '<div class="thumb">' + (d.f ? '<span class="badge">🥇 #1</span>' : d.cat === 'dxcc' ? '<span class="badge dx">🌍 DXCC</span>' : '') +
      '<img loading="lazy" alt="' + d.t + ' ' + d.y + ' certificate" src="' + thumbUrl(d.id) + '"></div>' +
      '<div class="info"><h3>' + d.t + (d.cat ? '' : ' ' + d.y) + '</h3><p>' + d.c + '</p><p class="res">' + d.r + '</p></div>';
    const img = card.querySelector('img');
    img.addEventListener('error', () => {
      img.replaceWith(Object.assign(document.createElement('div'), {className:'ph', textContent:'📜 Click to view certificate'}));
    });
    img.addEventListener('contextmenu', e => e.preventDefault());
    card.addEventListener('click', () => openLb(d));
    card.addEventListener('keydown', e => { if (e.key === 'Enter') openLb(d); });
    grid.appendChild(card);
  });
}

FILTERS.forEach(f => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = f.l;
  if (f.k === current) b.className = 'on';
  b.addEventListener('click', () => {
    current = f.k;
    [...filtersEl.children].forEach(x => x.className = '');
    b.className = 'on';
    render();
  });
  filtersEl.appendChild(b);
});

const lb = document.getElementById('lb');
const lbFrame = document.getElementById('lbFrame');
function openLb(d){
  document.getElementById('lbTitle').textContent = d.t + (d.cat ? '' : ' ' + d.y);
  lbFrame.src = 'https://drive.google.com/file/d/' + d.id + '/preview';
  lb.classList.add('open');
}
function closeLb(){ lb.classList.remove('open'); lbFrame.src = 'about:blank'; }
document.getElementById('lbClose').addEventListener('click', closeLb);
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });

render();
</script>
